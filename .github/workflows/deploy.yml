name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Verify WordPress secret
        shell: bash
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
        run: |
          if [ -z "$WORDPRESS_URL" ]; then
            echo "::error::Repository secret WORDPRESS_URL is missing. Set it to https://cms.theukmag.com"
            exit 1
          fi

      - name: Type-check source
        run: npm run typecheck

      - name: Remove legacy static article JSON
        shell: bash
        run: |
          find content/articles -maxdepth 1 -type f -name '*.json' -print -delete || true

      - name: Sync content from WordPress
        run: npm run sync:wp
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
